name: Verify RAG workshop
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag-system
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rag-system/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run eval
      - run: npm run build
